[general]
domain = "localhost:8080"
port = "8080"
email = "admin@example.com"
site_name = "Printshop Booking System"
# site_password = "your-site-password"

[database]
postgresql_url = "postgresql://printshop_user:printshop_password@localhost:5432/printshop"

[jwt]
secret = "your-super-secret-jwt-key-change-this-in-production"

# Twilio configuration (optional - comment out if not using)
[twilio]
account_sid = "your_twilio_account_sid"
auth_token = "your_twilio_auth_token"
verify_service_sid = "your_twilio_verify_service_sid"
messaging_service_sid = "your_twilio_messaging_service_sid"
phone_number = "+1234567890"

# Public print request form (/request). Unset = the form is disabled.
# request_password = "..."   (goes under [general])

# Discord bot that announces new print requests (optional). The bot's code is
# the public github.com/imeckler/printshop-discord-bot package; create the
# bot under the same Discord application as [discord] and paste its token.
# /admin/notifier shows the invite link and lists channel ids.
# Env equivalents: DISCORD_BOT_TOKEN, DISCORD_REQUEST_CHANNEL_ID.
# [discord_bot]
# bot_token = "..."
# channel_id = "123456789012345678"
